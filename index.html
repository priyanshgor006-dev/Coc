<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chamber of Commerce Bhuj — News & Updates</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #1e3a8a;
    --primary-soft: #dbeafe;
    --accent: #b45309;
    --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Gujarati", "Noto Sans Devanagari", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Header */
  header.site-header {
    background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 100%);
    color: #fff;
    padding: 24px 16px 20px;
    box-shadow: var(--shadow);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .brand h1 {
    font-size: 1.55rem;
    margin: 0 0 4px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand p {
    margin: 0;
    font-size: 0.95rem;
    opacity: 0.85;
    font-weight: 400;
  }
  .lang-toggle {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    padding: 4px;
    border-radius: 999px;
    align-self: flex-start;
    backdrop-filter: blur(4px);
  }
  .lang-toggle button {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.85);
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
  }
  .lang-toggle button:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .lang-toggle button.active {
    background: #fff;
    color: var(--primary);
  }

  @media (min-width: 640px) {
    .header-inner {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
    .brand h1 { font-size: 1.85rem; }
    .lang-toggle { align-self: center; }
  }

  /* Category chips */
  .chips-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 0 6px;
  }
  .chips-scroll {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 8px 16px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* News list */
  .news-list {
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 16px 60px;
    display: grid;
    gap: 16px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.1);
  }

  .card-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #eef2f7;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-image.fallback {
    background: linear-gradient(135deg, #e0e7ff 0%, #f5f3ff 100%);
    color: var(--primary);
  }
  .fallback-icon {
    width: 56px;
    height: 56px;
    opacity: 0.6;
  }

  .card-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .category-tag {
    display: inline-block;
    padding: 3px 10px;
    background: var(--primary-soft);
    color: var(--primary);
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .card-date {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .card-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
    color: var(--text);
    line-height: 1.35;
  }
  .card-excerpt {
    font-size: 0.93rem;
    color: var(--muted);
    margin: 0;
    line-height: 1.55;
  }
  .read-more {
    align-self: flex-start;
    margin-top: 4px;
    background: transparent;
    color: var(--primary);
    border: none;
    padding: 6px 0;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .read-more:hover { text-decoration: underline; }

  @media (min-width: 640px) {
    .card {
      grid-template-columns: 240px 1fr;
    }
    .card-image { aspect-ratio: auto; height: 100%; min-height: 160px; }
    .card-title { font-size: 1.25rem; }
    .news-list { gap: 18px; }
  }

  /* States */
  .state {
    text-align: center;
    padding: 60px 16px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    max-width: 720px;
    width: 100%;
    margin: 40px 0;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-image {
    width: 100%;
    max-height: 360px;
    object-fit: cover;
    display: block;
  }
  .modal-content { padding: 22px 24px 28px; }
  .modal-content h2 { margin: 0 0 6px; font-size: 1.45rem; line-height: 1.3; }
  .modal-content .card-meta { margin-bottom: 14px; }
  .modal-content .body-text { font-size: 1rem; line-height: 1.7; color: #374151; white-space: pre-wrap; }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-wrap { position: relative; max-width: 720px; width: 100%; }

  footer {
    text-align: center;
    padding: 24px 16px;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    background: var(--card);
  }

  /* ===== Hero Carousel ===== */
  .hero-carousel {
    position: relative;
    width: 100%;
    height: 240px;
    overflow: hidden;
    background: #0f172a;
  }
  @media (min-width: 640px) {
    .hero-carousel { height: 420px; }
  }
  @media (min-width: 1024px) {
    .hero-carousel { height: 480px; }
  }

  .carousel-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .carousel-slide {
    flex: 0 0 100%;
    height: 100%;
    position: relative;
    background-size: cover;
    background-position: center;
    background-color: #1e293b;
    background-repeat: no-repeat;
    cursor: pointer;
  }
  .carousel-slide.no-image {
    background: linear-gradient(135deg, #1e3a8a 0%, #4c1d95 55%, #831843 100%);
  }

  .carousel-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 35%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
  }

  .carousel-content {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 32px;
    color: #fff;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none; /* clicks pass through to slide */
  }
  @media (min-width: 640px) {
    .carousel-content { left: 32px; right: 32px; bottom: 40px; }
  }
  @media (min-width: 1024px) {
    .carousel-content { left: 48px; right: 48px; bottom: 56px; }
  }

  .carousel-content .category-tag {
    align-self: flex-start;
    background: rgba(255,255,255,0.18);
    color: #fff;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.22);
  }

  .carousel-title {
    margin: 0;
    font-size: 1.15rem;
    line-height: 1.3;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  @media (min-width: 640px) {
    .carousel-title { font-size: 1.7rem; }
  }
  @media (min-width: 1024px) {
    .carousel-title { font-size: 2.1rem; }
  }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    color: #1e3a8a;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    z-index: 5;
    transition: transform 0.15s ease, background 0.15s ease;
    font-family: inherit;
  }
  .carousel-arrow:hover { background: #fff; transform: translateY(-50%) scale(1.08); }
  .carousel-arrow.prev { left: 14px; }
  .carousel-arrow.next { right: 14px; }
  @media (min-width: 640px) {
    .carousel-arrow { display: flex; width: 44px; height: 44px; font-size: 1.6rem; }
    .carousel-arrow.prev { left: 18px; }
    .carousel-arrow.next { right: 18px; }
  }

  .carousel-dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 7px;
    z-index: 5;
  }
  @media (min-width: 640px) {
    .carousel-dots { bottom: 16px; gap: 9px; }
  }
  .carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .carousel-dot:hover { background: rgba(255,255,255,0.9); }
  .carousel-dot.active {
    background: #fff;
    width: 22px;
    border-radius: 999px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <h1 data-i18n="siteTitle">Chamber of Commerce Bhuj</h1>
      <p data-i18n="siteSubtitle">News and Updates</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="hi">हिं</button>
      <button data-lang="gu">ગુજ</button>
    </div>
  </div>
</header>

<section class="hero-carousel" id="heroCarousel" aria-label="Featured news">
  <!-- slides injected by JS -->
</section>

<div class="chips-wrap">
  <div class="chips-scroll" id="chipsScroll">
    <!-- chips injected here -->
  </div>
</div>

<main id="newsList" class="news-list">
  <div class="state" id="stateBox">
    <div class="spinner"></div>
    <div data-i18n="loading">Loading news…</div>
  </div>
</main>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true">
  <div class="modal-wrap">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div class="modal" id="modalInner">
      <img class="modal-image" id="modalImage" alt="" style="display:none" />
      <div class="modal-content">
        <div class="card-meta">
          <span class="category-tag" id="modalCategory"></span>
          <span class="card-date" id="modalDate"></span>
        </div>
        <h2 id="modalTitle"></h2>
        <p class="body-text" id="modalBody"></p>
      </div>
    </div>
  </div>
</div>

<footer>
  <span data-i18n="footer">© Chamber of Commerce Bhuj. All rights reserved.</span>
</footer>

<script>
/* ---------- Supabase config ---------- */
const SUPABASE_URL = "https://rvpiliwyqjowegmjcanr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2cGlsaXd5cWpvd2VnbWpjYW5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMDM2MjksImV4cCI6MjEwMjg3OTYyOX0.9ZQj69FLcFgqp8huYTqlWy4JGl-vYGmYZiiVUBo4Sio";

// IMPORTANT: named `supabaseClient` to avoid colliding with the global `supabase` object from the CDN script.
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- Translations (UI chrome only) ---------- */
const I18N = {
  en: {
    siteTitle: "Chamber of Commerce Bhuj",
    siteSubtitle: "News and Updates",
    allCategory: "All",
    readMore: "Read more",
    loading: "Loading news…",
    error: "Couldn't load news. Please try again later.",
    empty: "No news in this category yet.",
    footer: "© Chamber of Commerce Bhuj. All rights reserved.",
    locale: "en-US",
    fallbackCategory: "Update"
  },
  hi: {
    siteTitle: "भुज वाणिज्य मंडल",
    siteSubtitle: "समाचार और अपडेट",
    allCategory: "सभी",
    readMore: "और पढ़ें",
    loading: "समाचार लोड हो रहा है…",
    error: "समाचार लोड नहीं हो पाए। कृपया पुनः प्रयास करें।",
    empty: "इस श्रेणी में अभी कोई समाचार नहीं है।",
    footer: "© भुज वाणिज्य मंडल। सर्वाधिकार सुरक्षित।",
    locale: "hi-IN",
    fallbackCategory: "अपडेट"
  },
  gu: {
    siteTitle: "ભુજ ચેમ્બર ઑફ કોમર્સ",
    siteSubtitle: "સમાચાર અને અપડેટ્સ",
    allCategory: "બધા",
    readMore: "વધુ વાંચો",
    loading: "સમાચાર લોડ થઈ રહ્યા છે…",
    error: "સમાચાર લોડ થઈ શક્યા નથી. કૃપા કરીને ફરી પ્રયાસ કરો.",
    empty: "આ કેટેગરીમાં હજુ સુધી કોઈ સમાચાર નથી.",
    footer: "© ભુજ ચેમ્બર ઑફ કોમર્સ. સર્વાધિકાર સુરક્ષિત.",
    locale: "gu-IN",
    fallbackCategory: "અપડેટ"
  }
};

/* ---------- State ---------- */
let allPosts = [];
let currentLang = "en";
let currentCategory = null; // null === "All"

/* ---------- DOM refs ---------- */
const newsList = document.getElementById("newsList");
const stateBox = document.getElementById("stateBox");
const chipsScroll = document.getElementById("chipsScroll");
const modal = document.getElementById("modal");
const modalImage = document.getElementById("modalImage");
const modalCategory = document.getElementById("modalCategory");
const modalDate = document.getElementById("modalDate");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalClose = document.getElementById("modalClose");

/* ---------- Helpers ---------- */
function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return new Intl.DateTimeFormat(t("locale"), {
      year: "numeric", month: "short", day: "numeric"
    }).format(d);
  } catch (e) { return ""; }
}

function truncate(text, len) {
  if (!text) return "";
  const s = String(text).trim();
  if (s.length <= len) return s;
  return s.slice(0, len).trimEnd() + "…";
}

function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });
  document.documentElement.lang = currentLang === "hi" ? "hi" : (currentLang === "gu" ? "gu" : "en");
}

/* ---------- Rendering ---------- */
function renderChips() {
  // Collect unique categories, preserve original casing (case-insensitive dedupe, keep first)
  const seen = new Set();
  const categories = [];
  for (const p of allPosts) {
    if (!p.category) continue;
    const key = p.category.trim();
    if (!key) continue;
    const norm = key.toLowerCase();
    if (seen.has(norm)) continue;
    seen.add(norm);
    categories.push(key);
  }

  chipsScroll.innerHTML = "";

  // "All" chip
  const allChip = document.createElement("button");
  allChip.className = "chip" + (currentCategory === null ? " active" : "");
  allChip.type = "button";
  allChip.textContent = t("allCategory");
  allChip.addEventListener("click", () => {
    currentCategory = null;
    renderChips();
    renderNews();
  });
  chipsScroll.appendChild(allChip);

  for (const cat of categories) {
    const chip = document.createElement("button");
    chip.className = "chip" + (currentCategory !== null && currentCategory.toLowerCase() === cat.toLowerCase() ? " active" : "");
    chip.type = "button";
    chip.textContent = cat;
    chip.addEventListener("click", () => {
      currentCategory = cat;
      renderChips();
      renderNews();
    });
    chipsScroll.appendChild(chip);
  }
}

function fallbackIconSVG() {
  return `<svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect>
    <line x1="3.5" y1="9" x2="20.5" y2="9"></line>
    <line x1="7.5" y1="13" x2="13" y2="13"></line>
    <line x1="7.5" y1="16" x2="16.5" y2="16"></line>
  </svg>`;
}

function createCard(post) {
  const article = document.createElement("article");
  article.className = "card";

  // Image block
  const imgWrap = document.createElement("div");
  imgWrap.className = "card-image";
  if (post.image_url) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = post.title || "";
    img.src = post.image_url;
    img.onerror = () => {
      imgWrap.classList.add("fallback");
      imgWrap.innerHTML = fallbackIconSVG();
    };
    imgWrap.appendChild(img);
  } else {
    imgWrap.classList.add("fallback");
    imgWrap.innerHTML = fallbackIconSVG();
  }

  // Body block
  const body = document.createElement("div");
  body.className = "card-body";

  const meta = document.createElement("div");
  meta.className = "card-meta";

  const catLabel = post.category || t("fallbackCategory");
  const catTag = document.createElement("span");
  catTag.className = "category-tag";
  catTag.textContent = catLabel;

  const dateSpan = document.createElement("span");
  dateSpan.className = "card-date";
  // Prefer published_at, fall back to created_at
  dateSpan.textContent = formatDate(post.published_at || post.created_at);

  meta.appendChild(catTag);
  meta.appendChild(dateSpan);

  const title = document.createElement("h2");
  title.className = "card-title";
  title.textContent = post.title || "";

  const excerpt = document.createElement("p");
  excerpt.className = "card-excerpt";
  excerpt.textContent = truncate(post.body, 160);

  const readMore = document.createElement("button");
  readMore.className = "read-more";
  readMore.type = "button";
  readMore.textContent = t("readMore");
  readMore.addEventListener("click", () => openModal(post));

  body.appendChild(meta);
  body.appendChild(title);
  body.appendChild(excerpt);
  body.appendChild(readMore);

  article.appendChild(imgWrap);
  article.appendChild(body);
  article.addEventListener("click", (e) => {
    // avoid double-firing when clicking Read more
    if (e.target.closest(".read-more")) return;
    openModal(post);
  });
  article.style.cursor = "pointer";

  return article;
}

function renderNews() {
  newsList.innerHTML = "";
  const filtered = currentCategory === null
    ? allPosts
    : allPosts.filter(p => p.category && p.category.toLowerCase() === currentCategory.toLowerCase());

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "state";
    empty.textContent = t("empty");
    newsList.appendChild(empty);
    return;
  }

  for (const post of filtered) {
    newsList.appendChild(createCard(post));
  }
}

/* ---------- Modal ---------- */
function openModal(post) {
  if (post.image_url) {
    modalImage.src = post.image_url;
    modalImage.alt = post.title || "";
    modalImage.style.display = "block";
  } else {
    modalImage.style.display = "none";
  }
  modalCategory.textContent = post.category || t("fallbackCategory");
  modalDate.textContent = formatDate(post.published_at || post.created_at);
  modalTitle.textContent = post.title || "";
  modalBody.textContent = post.body || "";
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
}
modalClose.addEventListener("click", closeModal);
modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});

/* ---------- Language toggle ---------- */
document.querySelectorAll(".lang-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyTranslations();
    // Re-render dynamic UI to pick up translated "All" label and "Read more" buttons
    renderChips();
    renderNews();
  });
});

/* ---------- Data fetch ---------- */
async function loadNews() {
  try {
    const { data, error } = await supabaseClient
      .from("news_posts")
      .select("*")
      .order("published_at", { ascending: false, nullsFirst: false });

    if (error) throw error;

    allPosts = (data || []).slice().sort((a, b) => {
      // newest first; null published_at goes to the end
      const ta = a.published_at ? new Date(a.published_at).getTime() : 0;
      const tb = b.published_at ? new Date(b.published_at).getTime() : 0;
      return tb - ta;
    });

    renderChips();
    renderNews();
    buildCarousel();
  } catch (err) {
    console.error(err);
    newsList.innerHTML = "";
    const errBox = document.createElement("div");
    errBox.className = "state";
    errBox.textContent = t("error");
    newsList.appendChild(errBox);
  }
}

/* ---------- Hero Carousel ---------- */
const CAROUSEL_INTERVAL = 4500;
let carouselPosts = [];
let carouselIndex = 0;
let carouselTimer = null;

function buildCarousel() {
  const container = document.getElementById("heroCarousel");
  if (!container) return;

  // Use top 5 posts (already sorted newest-first by loadNews)
  carouselPosts = allPosts.slice(0, 5);
  carouselIndex = 0;

  if (carouselPosts.length === 0) {
    container.style.display = "none";
    stopAutoplay();
    return;
  }
  container.style.display = "";

  renderCarousel();
  startAutoplay();
}

function renderCarousel() {
  const container = document.getElementById("heroCarousel");
  container.innerHTML = "";

  const viewport = document.createElement("div");
  viewport.className = "carousel-viewport";

  const track = document.createElement("div");
  track.className = "carousel-track";
  track.id = "carouselTrack";

  carouselPosts.forEach((post, i) => {
    const slide = document.createElement("div");
    slide.className = "carousel-slide";
    slide.dataset.index = i;

    if (post.image_url) {
      slide.style.backgroundImage = `url("${CSS.escape(post.image_url)}")`;
    } else {
      slide.classList.add("no-image");
    }

    const overlay = document.createElement("div");
    overlay.className = "carousel-overlay";

    const content = document.createElement("div");
    content.className = "carousel-content";

    if (post.category) {
      const catTag = document.createElement("span");
      catTag.className = "category-tag";
      catTag.textContent = post.category;
      content.appendChild(catTag);
    }

    const title = document.createElement("h3");
    title.className = "carousel-title";
    title.textContent = post.title || "";
    content.appendChild(title);

    slide.appendChild(overlay);
    slide.appendChild(content);

    // Click-to-open modal (only if it wasn't a swipe)
    slide.addEventListener("click", () => {
      if (slide.dataset.swiped === "1") {
        slide.dataset.swiped = "0";
        return;
      }
      openModal(post);
    });

    track.appendChild(slide);
  });

  viewport.appendChild(track);
  container.appendChild(viewport);

  // Arrow buttons (desktop only via CSS)
  const prevBtn = document.createElement("button");
  prevBtn.className = "carousel-arrow prev";
  prevBtn.type = "button";
  prevBtn.setAttribute("aria-label", "Previous slide");
  prevBtn.innerHTML = "‹";
  prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevSlide(); });

  const nextBtn = document.createElement("button");
  nextBtn.className = "carousel-arrow next";
  nextBtn.type = "button";
  nextBtn.setAttribute("aria-label", "Next slide");
  nextBtn.innerHTML = "›";
  nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextSlide(); });

  container.appendChild(prevBtn);
  container.appendChild(nextBtn);

  // Dot indicators
  const dots = document.createElement("div");
  dots.className = "carousel-dots";
  carouselPosts.forEach((_, i) => {
    const dot = document.createElement("button");
    dot.className = "carousel-dot" + (i === carouselIndex ? " active" : "");
    dot.type = "button";
    dot.setAttribute("aria-label", "Go to slide " + (i + 1));
    dot.addEventListener("click", (e) => { e.stopPropagation(); goToSlide(i); });
    dots.appendChild(dot);
  });
  container.appendChild(dots);

  setupTouchHandlers(viewport);
  updateCarouselPosition();
}

function updateCarouselPosition() {
  const track = document.getElementById("carouselTrack");
  if (track) {
    track.style.transform = `translateX(-${carouselIndex * 100}%)`;
  }
  const dots = document.querySelectorAll("#heroCarousel .carousel-dot");
  dots.forEach((d, i) => d.classList.toggle("active", i === carouselIndex));
}

function goToSlide(i) {
  if (carouselPosts.length === 0) return;
  carouselIndex = (i + carouselPosts.length) % carouselPosts.length;
  updateCarouselPosition();
  restartAutoplay(); // manual interaction resets the timer
}
function nextSlide() { goToSlide(carouselIndex + 1); }
function prevSlide() { goToSlide(carouselIndex - 1); }

function startAutoplay() {
  stopAutoplay();
  if (carouselPosts.length < 2) return;
  carouselTimer = setInterval(() => {
    carouselIndex = (carouselIndex + 1) % carouselPosts.length;
    updateCarouselPosition();
  }, CAROUSEL_INTERVAL);
}
function stopAutoplay() {
  if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
}
function restartAutoplay() { startAutoplay(); }

function setupTouchHandlers(viewport) {
  let startX = 0;
  let startY = 0;
  let horizontalIntent = false;
  const THRESHOLD = 40;

  viewport.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    horizontalIntent = false;
  }, { passive: true });

  viewport.addEventListener("touchmove", (e) => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      horizontalIntent = true;
    }
  }, { passive: true });

  viewport.addEventListener("touchend", (e) => {
    const endX = e.changedTouches[0].clientX;
    const dx = endX - startX;
    if (horizontalIntent && Math.abs(dx) > THRESHOLD) {
      // Mark current slide so the click handler ignores this tap
      const slide = viewport.querySelector('.carousel-slide[data-index="' + carouselIndex + '"]');
      if (slide) slide.dataset.swiped = "1";

      if (dx < 0) nextSlide();
      else prevSlide();
    }
  });
}

/* ---------- Init ---------- */
applyTranslations();
loadNews();
</script>
